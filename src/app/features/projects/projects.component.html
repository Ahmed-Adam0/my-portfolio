<section id="projects" class="projects-section">
  <div class="projects-container">
    <div class="section-header" data-aos="fade-up">
      <h2>{{ 'projects.title' | translate }}</h2>
      <p>{{ 'projects.description' | translate }}</p>
    </div>

    <div class="projects-grid">
      <div
        *ngFor="let project of projects; let i = index"
        class="project-card"
        data-aos="fade-up"
        [attr.data-aos-delay]="100 + i * 100"
      >
        <div class="card-icon-wrapper">
          <span class="card-icon">{{ project.icon }}</span>
        </div>
        <div class="card-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="tags">
            <span *ngFor="let tag of project.tags" class="tag">{{ tag }}</span>
          </div>
          <a href="#" class="card-link">
            {{ 'projects.viewDetails' | translate }}
            <span class="arrow">→</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
